<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Shots — генератор скриншотов для App Store и Google Play</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e7eaf0; --muted:#9aa3b2; --accent:#5b8cff; --accent2:#7c5bff;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.4;
  }
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 18px; background:rgba(15,17,21,.9); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  header .logo{font-weight:700; font-size:16px; letter-spacing:.3px}
  header .logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  header .spacer{flex:1}
  .btn{
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    padding:8px 14px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:600;
    transition:.15s; white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2)); border:none}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 9px; font-size:12px}
  select,input[type=text],input[type=number]{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; font-size:13px; width:100%; font-family:inherit;
  }
  input[type=color]{width:38px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:2px;cursor:pointer}
  textarea{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; font-size:13px; width:100%; font-family:inherit; resize:vertical; min-height:56px;
  }
  label.fld{display:block; margin:0 0 12px}
  label.fld > .lbl{display:block; color:var(--muted); font-size:12px; margin-bottom:5px; font-weight:600}
  .row{display:flex; gap:8px; align-items:center}
  .row > *{flex:1}
  .layout{display:flex; align-items:flex-start; gap:0}
  aside{
    width:320px; flex-shrink:0; padding:18px; border-right:1px solid var(--line);
    position:sticky; top:57px; height:calc(100vh - 57px); overflow-y:auto;
  }
  aside h3{margin:22px 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted)}
  aside h3:first-child{margin-top:0}
  main{flex:1; padding:18px; min-width:0}
  .slides{display:flex; flex-wrap:wrap; gap:18px}
  .slide{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; width:280px;
  }
  .slide .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .slide .head .num{font-weight:700; color:var(--muted); font-size:12px}
  .slide .actions{display:flex; gap:5px}
  .canvas-wrap{
    background:repeating-conic-gradient(#20242e 0% 25%, #1a1d25 0% 50%) 50%/18px 18px;
    border-radius:10px; overflow:hidden; display:flex; justify-content:center; margin:10px 0;
  }
  .slide canvas{display:block; width:100%; height:auto}
  .drop{
    border:1.5px dashed var(--line); border-radius:9px; padding:12px; text-align:center;
    color:var(--muted); font-size:12px; cursor:pointer; transition:.15s;
  }
  .drop:hover,.drop.over{border-color:var(--accent); color:var(--text)}
  .add-slide{
    width:280px; min-height:120px; border:1.5px dashed var(--line); border-radius:var(--radius);
    background:transparent; color:var(--muted); font-size:14px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .add-slide:hover{border-color:var(--accent); color:var(--text)}
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .seg button{flex:1; background:transparent; color:var(--muted); border:none; padding:7px; cursor:pointer; font-size:12px; font-weight:600}
  .seg button.on{background:var(--accent); color:#fff}
  .hint{color:var(--muted); font-size:12px; margin-top:4px}
  .hidden{display:none !important}
  .muted{color:var(--muted)}
  input[type=range]{width:100%; accent-color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="logo">Store<span>Shots</span></div>
  <span class="hint" data-i18n="tagline">Скриншоты для App Store и Google Play прямо в браузере</span>
  <div class="spacer"></div>
  <div class="seg" style="width:88px" id="langSeg">
    <button data-lang="ru" class="on">RU</button>
    <button data-lang="en">EN</button>
  </div>
  <button class="btn" id="addSlideBtn" data-i18n="addShot">+ Кадр</button>
  <button class="btn primary" id="downloadAllBtn" data-i18n="downloadAll">Скачать всё (ZIP)</button>
</header>

<div class="layout">
  <aside>
    <h3 data-i18n="h_format">Формат</h3>
    <label class="fld">
      <span class="lbl" data-i18n="l_store">Магазин / устройство</span>
      <select id="presetSel"></select>
    </label>
    <div class="hint" id="sizeHint"></div>

    <h3 data-i18n="h_bg">Фон</h3>
    <label class="fld">
      <span class="lbl" data-i18n="l_bgtype">Тип фона</span>
      <div class="seg" id="bgTypeSeg">
        <button data-bg="solid" class="on" data-i18n="bg_solid">Цвет</button>
        <button data-bg="gradient" data-i18n="bg_grad">Градиент</button>
        <button data-bg="image" data-i18n="bg_img">Картинка</button>
      </div>
    </label>
    <label class="fld" id="bgColorRow">
      <span class="lbl" data-i18n="l_color">Цвет</span>
      <div class="row" style="align-items:center">
        <input type="color" id="bgColor" value="#5b8cff" style="flex:0 0 38px">
        <input type="text" id="bgColorHex" value="#5b8cff">
      </div>
    </label>
    <label class="fld hidden" id="bgColor2Row">
      <span class="lbl" data-i18n="l_color2">Второй цвет</span>
      <div class="row" style="align-items:center">
        <input type="color" id="bgColor2" value="#7c5bff" style="flex:0 0 38px">
        <input type="text" id="bgColor2Hex" value="#7c5bff">
      </div>
    </label>
    <label class="fld hidden" id="bgAngleRow">
      <span class="lbl"><span data-i18n="l_angle">Угол градиента</span>: <span id="bgAngleVal">135</span>°</span>
      <input type="range" id="bgAngle" min="0" max="360" value="135">
    </label>
    <label class="fld hidden" id="bgImageRow">
      <span class="lbl" data-i18n="l_bgimg">Изображение фона</span>
      <div class="drop" id="bgImageDrop" data-i18n="drop_bg">Нажми или перетащи картинку</div>
      <input type="file" accept="image/*" id="bgImageInput" class="hidden">
    </label>

    <h3 data-i18n="h_text">Текст</h3>
    <label class="fld">
      <span class="lbl" data-i18n="l_pos">Положение текста</span>
      <div class="seg" id="textPosSeg">
        <button data-pos="top" class="on" data-i18n="pos_top">Сверху</button>
        <button data-pos="bottom" data-i18n="pos_bottom">Снизу</button>
      </div>
    </label>
    <label class="fld">
      <span class="lbl" data-i18n="l_font">Шрифт</span>
      <select id="fontSel"></select>
    </label>
    <label class="fld">
      <span class="lbl"><span data-i18n="l_fsize">Размер</span>: <span id="fsizeVal">6.0</span>%</span>
      <input type="range" id="fsize" min="3" max="11" step="0.1" value="6">
    </label>
    <label class="fld">
      <span class="lbl" data-i18n="l_tcolor">Цвет текста</span>
      <div class="row" style="align-items:center">
        <input type="color" id="textColor" value="#ffffff" style="flex:0 0 38px">
        <input type="text" id="textColorHex" value="#ffffff">
      </div>
    </label>
    <label class="fld">
      <span class="row" style="align-items:center; gap:8px">
        <input type="checkbox" id="textBold" checked style="flex:0 0 auto; width:auto">
        <span data-i18n="l_bold">Жирный</span>
      </span>
    </label>

    <h3 data-i18n="h_frame">Рамка телефона</h3>
    <label class="fld">
      <span class="row" style="align-items:center; gap:8px">
        <input type="checkbox" id="frameOn" checked style="flex:0 0 auto; width:auto">
        <span data-i18n="l_frameon">Показывать рамку</span>
      </span>
    </label>
    <label class="fld">
      <span class="lbl" data-i18n="l_framestyle">Стиль рамки</span>
      <div class="seg" id="frameStyleSeg">
        <button data-fr="ios" class="on">iOS</button>
        <button data-fr="android">Android</button>
      </div>
    </label>
    <label class="fld">
      <span class="lbl" data-i18n="l_framecolor">Цвет рамки</span>
      <div class="row" style="align-items:center">
        <input type="color" id="frameColor" value="#0d0d0f" style="flex:0 0 38px">
        <input type="text" id="frameColorHex" value="#0d0d0f">
      </div>
    </label>
    <label class="fld">
      <span class="lbl"><span data-i18n="l_scale">Размер телефона</span>: <span id="scaleVal">78</span>%</span>
      <input type="range" id="phoneScale" min="45" max="98" value="78">
    </label>
    <label class="fld">
      <span class="row" style="align-items:center; gap:8px">
        <input type="checkbox" id="shadowOn" checked style="flex:0 0 auto; width:auto">
        <span data-i18n="l_shadow">Тень под телефоном</span>
      </span>
    </label>
  </aside>

  <main>
    <div class="slides" id="slides"></div>
  </main>
</div>

<script>
"use strict";

/* ---------------- i18n ---------------- */
const I18N = {
  ru:{
    tagline:"Скриншоты для App Store и Google Play прямо в браузере",
    addShot:"+ Кадр", downloadAll:"Скачать всё (ZIP)",
    h_format:"Формат", l_store:"Магазин / устройство",
    h_bg:"Фон", l_bgtype:"Тип фона", bg_solid:"Цвет", bg_grad:"Градиент", bg_img:"Картинка",
    l_color:"Цвет", l_color2:"Второй цвет", l_angle:"Угол градиента", l_bgimg:"Изображение фона",
    drop_bg:"Нажми или перетащи картинку",
    h_text:"Текст", l_pos:"Положение текста", pos_top:"Сверху", pos_bottom:"Снизу",
    l_font:"Шрифт", l_fsize:"Размер", l_tcolor:"Цвет текста", l_bold:"Жирный",
    h_frame:"Рамка телефона", l_frameon:"Показывать рамку", l_framestyle:"Стиль рамки",
    l_framecolor:"Цвет рамки", l_scale:"Размер телефона", l_shadow:"Тень под телефоном",
    dropShot:"Нажми или перетащи скриншот", caption_ph:"Заголовок кадра…",
    download:"Скачать PNG", del:"Удалить", up:"◀", down:"▶",
    placeholder:"Загрузите скриншот",
    confirmDel:"Удалить этот кадр?"
  },
  en:{
    tagline:"App Store & Google Play screenshots right in your browser",
    addShot:"+ Shot", downloadAll:"Download all (ZIP)",
    h_format:"Format", l_store:"Store / device",
    h_bg:"Background", l_bgtype:"Background type", bg_solid:"Color", bg_grad:"Gradient", bg_img:"Image",
    l_color:"Color", l_color2:"Second color", l_angle:"Gradient angle", l_bgimg:"Background image",
    drop_bg:"Click or drop an image",
    h_text:"Text", l_pos:"Text position", pos_top:"Top", pos_bottom:"Bottom",
    l_font:"Font", l_fsize:"Size", l_tcolor:"Text color", l_bold:"Bold",
    h_frame:"Phone frame", l_frameon:"Show frame", l_framestyle:"Frame style",
    l_framecolor:"Frame color", l_scale:"Phone size", l_shadow:"Shadow under phone",
    dropShot:"Click or drop a screenshot", caption_ph:"Frame caption…",
    download:"Download PNG", del:"Delete", up:"◀", down:"▶",
    placeholder:"Upload a screenshot",
    confirmDel:"Delete this frame?"
  }
};
let LANG = "ru";
const t = k => (I18N[LANG][k] ?? k);

function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("on", b.dataset.lang===LANG));
  document.documentElement.lang = LANG;
  rebuildSlideCards(); // refresh dynamic labels
}

/* ---------------- presets & fonts ---------------- */
const PRESETS = [
  {group:"App Store (iOS)", items:[
    {id:"ios69", name:'iPhone 6.9" — 1290×2796', w:1290, h:2796, fr:"ios"},
    {id:"ios65", name:'iPhone 6.5" — 1242×2688', w:1242, h:2688, fr:"ios"},
    {id:"ios55", name:'iPhone 5.5" — 1242×2208', w:1242, h:2208, fr:"ios"},
    {id:"ipad",  name:'iPad Pro 12.9" — 2048×2732', w:2048, h:2732, fr:"ios"},
  ]},
  {group:"Google Play (Android)", items:[
    {id:"and916a", name:'Phone 9:16 — 1080×1920', w:1080, h:1920, fr:"android"},
    {id:"and916b", name:'Phone 9:19.5 — 1080×2340', w:1080, h:2340, fr:"android"},
    {id:"and169",  name:'Phone 16:9 — 1920×1080', w:1920, h:1080, fr:"android"},
    {id:"tab7",    name:'Tablet 7" — 1200×1920', w:1200, h:1920, fr:"android"},
    {id:"feature", name:'Feature graphic — 1024×500', w:1024, h:500, fr:"android"},
  ]},
];
const ALL_PRESETS = PRESETS.flatMap(g=>g.items);

const FONTS = [
  {name:"Sans (system)", css:'-apple-system,system-ui,"Segoe UI",Roboto,sans-serif'},
  {name:"Serif",        css:'Georgia,"Times New Roman",serif'},
  {name:"Rounded",      css:'"SF Pro Rounded","Nunito",system-ui,sans-serif'},
  {name:"Mono",         css:'"SF Mono",Menlo,Consolas,monospace'},
];

/* ---------------- global settings ---------------- */
const S = {
  preset: ALL_PRESETS[0],
  bgType:"gradient",
  bgColor:"#5b8cff", bgColor2:"#7c5bff", bgAngle:135, bgImage:null,
  textPos:"top", font:FONTS[0].css, fsize:6.0, textColor:"#ffffff", bold:true,
  frameOn:true, frameStyle:"ios", frameColor:"#0d0d0f", phoneScale:78, shadowOn:true,
};

/* ---------------- slides state ---------------- */
let slideSeq = 0;
const slides = []; // {id, img:HTMLImageElement|null, caption:string, canvas, drawFn}

/* ---------------- drawing ---------------- */
function roundRectPath(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawCover(ctx,img,x,y,w,h){
  const ar = img.naturalWidth/img.naturalHeight, tar = w/h;
  let dw,dh;
  if(ar>tar){ dh=h; dw=h*ar; } else { dw=w; dh=w/ar; }
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
}
function wrapText(ctx,text,maxW){
  const out=[];
  text.split("\n").forEach(para=>{
    if(para.trim()===""){ out.push(""); return; }
    const words=para.split(/\s+/); let cur="";
    for(const w of words){
      const test = cur ? cur+" "+w : w;
      if(ctx.measureText(test).width>maxW && cur){ out.push(cur); cur=w; }
      else cur=test;
    }
    if(cur) out.push(cur);
  });
  return out;
}

function drawScene(ctx, slide){
  const W=S.preset.w, H=S.preset.h;
  ctx.clearRect(0,0,W,H);

  // ---- background ----
  if(S.bgType==="solid"){
    ctx.fillStyle=S.bgColor; ctx.fillRect(0,0,W,H);
  } else if(S.bgType==="gradient"){
    const a=(S.bgAngle-90)*Math.PI/180;
    const cx=W/2, cy=H/2, len=Math.max(W,H);
    const x0=cx-Math.cos(a)*len/2, y0=cy-Math.sin(a)*len/2;
    const x1=cx+Math.cos(a)*len/2, y1=cy+Math.sin(a)*len/2;
    const g=ctx.createLinearGradient(x0,y0,x1,y1);
    g.addColorStop(0,S.bgColor); g.addColorStop(1,S.bgColor2);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  } else if(S.bgType==="image" && S.bgImage){
    drawCover(ctx,S.bgImage,0,0,W,H);
  } else {
    ctx.fillStyle="#222"; ctx.fillRect(0,0,W,H);
  }

  const margin = W*0.07;

  // ---- text block metrics ----
  const fontPx = W*(S.fsize/100);
  const lineH = fontPx*1.28;
  ctx.font = `${S.bold?"700":"400"} ${fontPx}px ${S.font}`;
  const caption = (slide.caption||"").trim();
  const lines = caption ? wrapText(ctx, caption, W-2*margin) : [];
  const textBlockH = lines.length ? lines.length*lineH + fontPx*0.4 : 0;

  // ---- regions ----
  let phoneTop, phoneBottom, textTop;
  const gap = H*0.02;
  if(S.textPos==="top"){
    textTop = margin;
    phoneTop = margin + textBlockH + (textBlockH?gap:0);
    phoneBottom = H - margin;
  } else {
    phoneTop = margin;
    phoneBottom = H - margin - textBlockH - (textBlockH?gap:0);
    textTop = phoneBottom + gap;
  }

  // ---- phone frame ----
  const availW = W - 2*margin;
  const availH = Math.max(10, phoneBottom - phoneTop);
  const img = slide.img;
  const screenAR = img ? img.naturalWidth/img.naturalHeight : 9/19.5;

  if(S.frameOn){
    const bezelR = 0.026;               // bezel thickness / phone width
    let pw = availW * (S.phoneScale/100);
    let sw = pw*(1-2*bezelR);
    let sh = sw/screenAR;
    let ph = sh + 2*(bezelR*pw);
    if(ph>availH){ const k=availH/ph; pw*=k; sw*=k; sh*=k; ph*=k; }
    const px=(W-pw)/2, py=phoneTop+(availH-ph)/2;
    const bez=bezelR*pw;
    const outerR=pw*0.13, innerR=pw*0.105;

    // shadow
    if(S.shadowOn){
      ctx.save();
      ctx.shadowColor="rgba(0,0,0,.35)";
      ctx.shadowBlur=pw*0.09; ctx.shadowOffsetY=pw*0.05;
      ctx.fillStyle=S.frameColor;
      roundRectPath(ctx,px,py,pw,ph,outerR); ctx.fill();
      ctx.restore();
    }
    // frame
    ctx.fillStyle=S.frameColor;
    roundRectPath(ctx,px,py,pw,ph,outerR); ctx.fill();

    // screen
    const sx=px+bez, sy=py+bez;
    ctx.save();
    roundRectPath(ctx,sx,sy,sw,sh,innerR); ctx.clip();
    if(img){ drawCover(ctx,img,sx,sy,sw,sh); }
    else {
      ctx.fillStyle="#e9edf3"; ctx.fillRect(sx,sy,sw,sh);
      ctx.fillStyle="#9aa3b2";
      ctx.font=`600 ${sw*0.06}px ${S.font}`;
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(t("placeholder"), sx+sw/2, sy+sh/2);
    }
    ctx.restore();

    // notch / camera
    ctx.fillStyle="#0a0a0c";
    if(S.frameStyle==="ios"){
      const iw=sw*0.34, ih=pw*0.032, ix=sx+(sw-iw)/2, iy=sy+pw*0.022;
      roundRectPath(ctx,ix,iy,iw,ih,ih/2); ctx.fill();
    } else {
      const r=pw*0.013;
      ctx.beginPath(); ctx.arc(sx+sw/2, sy+pw*0.03+r, r, 0, Math.PI*2); ctx.fill();
    }
  } else {
    // no frame: just place the screenshot centered with rounded corners
    let sw=availW*(S.phoneScale/100), sh=sw/screenAR;
    if(sh>availH){ const k=availH/sh; sw*=k; sh*=k; }
    const sx=(W-sw)/2, sy=phoneTop+(availH-sh)/2;
    ctx.save();
    if(S.shadowOn){ ctx.shadowColor="rgba(0,0,0,.3)"; ctx.shadowBlur=sw*0.06; ctx.shadowOffsetY=sw*0.03; }
    roundRectPath(ctx,sx,sy,sw,sh,sw*0.06);
    if(img){ ctx.clip(); drawCover(ctx,img,sx,sy,sw,sh); }
    else { ctx.fillStyle="#e9edf3"; ctx.fill(); }
    ctx.restore();
  }

  // ---- text ----
  if(lines.length){
    ctx.fillStyle=S.textColor;
    ctx.font=`${S.bold?"700":"400"} ${fontPx}px ${S.font}`;
    ctx.textAlign="center"; ctx.textBaseline="top";
    let y = S.textPos==="top" ? textTop : textTop;
    lines.forEach(ln=>{ ctx.fillText(ln, W/2, y); y+=lineH; });
  }
}

/* ---------------- render ---------------- */
function renderSlide(slide){
  const W=S.preset.w, H=S.preset.h;
  const cv=slide.canvas;
  if(cv.width!==W || cv.height!==H){ cv.width=W; cv.height=H; }
  const ctx=cv.getContext("2d");
  drawScene(ctx, slide);
}
function renderAll(){ slides.forEach(renderSlide); }

/* ---------------- slide cards ---------------- */
const slidesEl = document.getElementById("slides");
const addSlideCard = document.createElement("button");

function makeSlide(caption=""){
  const slide={ id:++slideSeq, img:null, caption, canvas:document.createElement("canvas"), card:null };
  slides.push(slide);
  buildCard(slide);
  layoutSlides();
  renderSlide(slide);
  return slide;
}

function buildCard(slide){
  const card=document.createElement("div");
  card.className="slide";
  slide.card=card;

  const head=document.createElement("div");
  head.className="head";
  const num=document.createElement("div");
  num.className="num";
  const actions=document.createElement("div");
  actions.className="actions";

  const upBtn=btn("sm", t("up"), ()=>moveSlide(slide,-1));
  const downBtn=btn("sm", t("down"), ()=>moveSlide(slide,1));
  const delBtn=btn("sm", "✕", ()=>{ if(confirm(t("confirmDel"))) removeSlide(slide); });
  actions.append(upBtn,downBtn,delBtn);
  head.append(num,actions);

  // canvas preview
  const wrap=document.createElement("div");
  wrap.className="canvas-wrap";
  wrap.appendChild(slide.canvas);

  // drop area
  const drop=document.createElement("div");
  drop.className="drop";
  drop.textContent=t("dropShot");
  const fileInput=document.createElement("input");
  fileInput.type="file"; fileInput.accept="image/*"; fileInput.className="hidden";
  drop.onclick=()=>fileInput.click();
  fileInput.onchange=e=>{ const f=e.target.files[0]; if(f) loadImageInto(f, im=>{ slide.img=im; drop.textContent="✓ "+f.name; renderSlide(slide); }); };
  dnd(drop, f=>loadImageInto(f, im=>{ slide.img=im; drop.textContent="✓ "+f.name; renderSlide(slide); }));

  // caption
  const ta=document.createElement("textarea");
  ta.placeholder=t("caption_ph");
  ta.value=slide.caption;
  ta.oninput=()=>{ slide.caption=ta.value; renderSlide(slide); };

  // download
  const dl=btn("sm", "⬇ "+t("download"), ()=>downloadOne(slide));
  dl.style.width="100%"; dl.style.marginTop="8px";

  card.append(head, wrap, drop, fileInput, ta, dl);
  slide._refs={num, upBtn, downBtn, ta, drop, dl};
  slidesEl.insertBefore(card, addSlideCard);
}

function btn(cls,label,fn){ const b=document.createElement("button"); b.className="btn "+cls; b.textContent=label; b.onclick=fn; return b; }

function moveSlide(slide,dir){
  const i=slides.indexOf(slide), j=i+dir;
  if(j<0||j>=slides.length) return;
  slides.splice(i,1); slides.splice(j,0,slide);
  layoutSlides();
}
function removeSlide(slide){
  const i=slides.indexOf(slide);
  slides.splice(i,1);
  slide.card.remove();
  if(!slides.length) makeSlide();
  layoutSlides();
}
function layoutSlides(){
  slides.forEach((s,i)=>{
    slidesEl.insertBefore(s.card, addSlideCard);
    s._refs.num.textContent = (LANG==="ru"?"Кадр ":"Frame ")+(i+1);
  });
}
function rebuildSlideCards(){
  slides.forEach(s=>{
    if(!s._refs) return;
    s._refs.upBtn.textContent=t("up");
    s._refs.downBtn.textContent=t("down");
    s._refs.ta.placeholder=t("caption_ph");
    s._refs.dl.textContent="⬇ "+t("download");
    if(!s.img) s._refs.drop.textContent=t("dropShot");
  });
  layoutSlides();
  renderAll();
}

/* drag & drop helper */
function dnd(el, onFile){
  ["dragenter","dragover"].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();el.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();el.classList.remove("over");}));
  el.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith("image/")) onFile(f); });
}
function loadImageInto(file, cb){
  const url=URL.createObjectURL(file);
  const im=new Image();
  im.onload=()=>cb(im);
  im.src=url;
}

/* ---------------- download ---------------- */
function sanitize(str){ return (str||"").replace(/[^\p{L}\p{N}\-_ ]/gu,"").trim().replace(/\s+/g,"-").slice(0,40); }
function fileName(slide,i){
  const base=sanitize(slide.caption)||("shot-"+(i+1));
  return `${S.preset.id}_${String(i+1).padStart(2,"0")}_${base}.png`;
}
function downloadOne(slide){
  const i=slides.indexOf(slide);
  slide.canvas.toBlob(b=>saveBlob(b, fileName(slide,i)),"image/png");
}
function saveBlob(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function downloadAll(){
  const files=[];
  for(let i=0;i<slides.length;i++){
    const blob=await new Promise(res=>slides[i].canvas.toBlob(res,"image/png"));
    const buf=new Uint8Array(await blob.arrayBuffer());
    files.push({name:fileName(slides[i],i), data:buf});
  }
  const zip=buildZip(files);
  saveBlob(zip, `${S.preset.id}_screenshots.zip`);
}

/* ---- minimal ZIP (store, no compression), pure JS ---- */
let CRC_TABLE=null;
function crcTable(){
  if(CRC_TABLE) return CRC_TABLE;
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? (0xEDB88320^(c>>>1)) : (c>>>1); t[n]=c>>>0; }
  return (CRC_TABLE=t);
}
function crc32(bytes){
  const t=crcTable(); let c=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c=(c>>>8)^t[(c^bytes[i])&0xFF];
  return (c^0xFFFFFFFF)>>>0;
}
function buildZip(files){
  const enc=new TextEncoder();
  const parts=[]; const central=[]; let offset=0;
  for(const f of files){
    const nameB=enc.encode(f.name);
    const crc=crc32(f.data);
    const lh=new Uint8Array(30+nameB.length);
    const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0x21,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,f.data.length,true); dv.setUint32(22,f.data.length,true);
    dv.setUint16(26,nameB.length,true); dv.setUint16(28,0,true);
    lh.set(nameB,30);
    parts.push(lh, f.data);
    const cd=new Uint8Array(46+nameB.length);
    const cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0x21,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,f.data.length,true); cv.setUint32(24,f.data.length,true);
    cv.setUint16(28,nameB.length,true);
    cv.setUint32(42,offset,true);
    cd.set(nameB,46);
    central.push(cd);
    offset += lh.length + f.data.length;
  }
  const centralSize=central.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array(22);
  const ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,centralSize,true); ev.setUint32(16,offset,true);
  return new Blob([...parts,...central,end],{type:"application/zip"});
}

/* ---------------- controls wiring ---------------- */
function buildPresetSelect(){
  const sel=document.getElementById("presetSel"); sel.innerHTML="";
  PRESETS.forEach(g=>{
    const og=document.createElement("optgroup"); og.label=g.group;
    g.items.forEach(p=>{ const o=document.createElement("option"); o.value=p.id; o.textContent=p.name; og.appendChild(o); });
    sel.appendChild(og);
  });
  sel.value=S.preset.id;
  sel.onchange=()=>{
    S.preset=ALL_PRESETS.find(p=>p.id===sel.value);
    // auto-switch frame style hint to match platform
    S.frameStyle=S.preset.fr;
    document.querySelectorAll("#frameStyleSeg button").forEach(b=>b.classList.toggle("on",b.dataset.fr===S.frameStyle));
    updateSizeHint(); renderAll();
  };
  updateSizeHint();
}
function updateSizeHint(){
  document.getElementById("sizeHint").textContent = `${S.preset.w} × ${S.preset.h}px`;
}
function buildFontSelect(){
  const sel=document.getElementById("fontSel");
  FONTS.forEach((f,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=f.name; o.style.fontFamily=f.css; sel.appendChild(o); });
  sel.onchange=()=>{ S.font=FONTS[+sel.value].css; renderAll(); };
}

function linkColor(colorId,hexId,key){
  const c=document.getElementById(colorId), h=document.getElementById(hexId);
  c.oninput=()=>{ S[key]=c.value; h.value=c.value; renderAll(); };
  h.oninput=()=>{ if(/^#[0-9a-fA-F]{6}$/.test(h.value)){ S[key]=h.value; c.value=h.value; renderAll(); } };
}
function seg(id,attr,key,after){
  document.querySelectorAll(`#${id} button`).forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      S[key]=b.dataset[attr];
      if(after) after();
      renderAll();
    };
  });
}

function initControls(){
  buildPresetSelect();
  buildFontSelect();
  document.getElementById("fontSel").value="0";

  linkColor("bgColor","bgColorHex","bgColor");
  linkColor("bgColor2","bgColor2Hex","bgColor2");
  linkColor("textColor","textColorHex","textColor");
  linkColor("frameColor","frameColorHex","frameColor");

  seg("bgTypeSeg","bg","bgType",()=>{
    document.getElementById("bgColorRow").classList.toggle("hidden", S.bgType==="image");
    document.getElementById("bgColor2Row").classList.toggle("hidden", S.bgType!=="gradient");
    document.getElementById("bgAngleRow").classList.toggle("hidden", S.bgType!=="gradient");
    document.getElementById("bgImageRow").classList.toggle("hidden", S.bgType!=="image");
  });
  seg("textPosSeg","pos","textPos");
  seg("frameStyleSeg","fr","frameStyle");

  const bgA=document.getElementById("bgAngle");
  bgA.oninput=()=>{ S.bgAngle=+bgA.value; document.getElementById("bgAngleVal").textContent=bgA.value; renderAll(); };
  const fs=document.getElementById("fsize");
  fs.oninput=()=>{ S.fsize=+fs.value; document.getElementById("fsizeVal").textContent=(+fs.value).toFixed(1); renderAll(); };
  const ps=document.getElementById("phoneScale");
  ps.oninput=()=>{ S.phoneScale=+ps.value; document.getElementById("scaleVal").textContent=ps.value; renderAll(); };

  document.getElementById("textBold").onchange=e=>{ S.bold=e.target.checked; renderAll(); };
  document.getElementById("frameOn").onchange=e=>{ S.frameOn=e.target.checked; renderAll(); };
  document.getElementById("shadowOn").onchange=e=>{ S.shadowOn=e.target.checked; renderAll(); };

  // bg image upload
  const bgDrop=document.getElementById("bgImageDrop"), bgInput=document.getElementById("bgImageInput");
  bgDrop.onclick=()=>bgInput.click();
  bgInput.onchange=e=>{ const f=e.target.files[0]; if(f) loadImageInto(f,im=>{ S.bgImage=im; bgDrop.textContent="✓ "+f.name; renderAll(); }); };
  dnd(bgDrop, f=>loadImageInto(f,im=>{ S.bgImage=im; bgDrop.textContent="✓ "+f.name; renderAll(); }));

  // default bg type = gradient
  document.querySelectorAll("#bgTypeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.bg==="gradient"));
  document.getElementById("bgColor2Row").classList.remove("hidden");
  document.getElementById("bgAngleRow").classList.remove("hidden");

  document.getElementById("addSlideBtn").onclick=()=>makeSlide();
  document.getElementById("downloadAllBtn").onclick=downloadAll;

  document.querySelectorAll("#langSeg button").forEach(b=>{
    b.onclick=()=>{ LANG=b.dataset.lang; applyLang(); };
  });
}

/* ---------------- init ---------------- */
addSlideCard.className="add-slide";
addSlideCard.textContent="+";
addSlideCard.onclick=()=>makeSlide();
slidesEl.appendChild(addSlideCard);

initControls();
applyLang();
makeSlide(LANG==="ru"?"Ваш заголовок здесь":"Your headline here");
</script>
</body>
</html>
